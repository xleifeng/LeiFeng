<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="description" content="Leifeng 下载管理界面" />
    <title>Leifeng</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%2314b8a6'/%3E%3Cstop offset='1' stop-color='%230891b2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M17.6 5.5 9.8 17.4c-.32.5.06 1.15.66 1.15h4.42l-2.36 7.3c-.24.74.75 1.22 1.27.62l8.14-9.4c.4-.47.06-1.18-.6-1.18h-4.5l2.2-9.05c.16-.68-.67-1.1-1.13-.57z' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // 主题预置：Vue 挂载前同步写入 data-theme，防止首帧闪白（与 stores/shell.ts 的持久化 key 一致）
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('leifeng.ui.theme.v1') ||
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch { document.documentElement.dataset.theme = 'light' }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
