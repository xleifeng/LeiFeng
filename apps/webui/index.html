<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f6" />
    <meta name="description" content="Leifeng 下载管理界面" />
    <title>Leifeng</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23226df5'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='17' font-weight='600' fill='%23fff' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
    <script>
      // 主题预置：Vue 挂载前同步写入 data-theme，防止首帧闪白（与 stores/shell.ts 的持久化 key 一致）
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('ThunderNativeUI.Theme.v1') || 'light'
      } catch { document.documentElement.dataset.theme = 'light' }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
